name: Refresh Server Dependencies

on:
  push:
    branches: ["fix/server-dependency-advisories"]
    paths:
      - ".github/workflows/refresh-server-dependencies.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v5
        with:
          ref: fix/server-dependency-advisories
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Apply compatible security updates
        run: npm audit fix
      - name: Verify zero production advisories
        run: npm audit --omit=dev --audit-level=low
      - name: Verify syntax
        run: npm run check
      - name: Verify tests
        run: npm test
      - name: Commit resolved dependency graph
        working-directory: .
        run: |
          if git diff --quiet -- server/package.json server/package-lock.json; then
            echo "Dependency graph already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package.json server/package-lock.json
          git commit -m "fix server dependency security advisories"
          git push origin HEAD:fix/server-dependency-advisories
