name: Refresh Client Dependencies

on:
  push:
    branches: ["feat/production-overhaul"]
    paths:
      - ".github/workflows/refresh-client-dependencies.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/production-overhaul
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Apply compatible security updates
        run: npm audit fix
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify lint
        run: npm run lint
      - name: Verify production build
        run: npm run build
      - name: Commit resolved dependency graph
        working-directory: .
        run: |
          if git diff --quiet -- client/package.json client/package-lock.json; then
            echo "Dependency graph already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package.json client/package-lock.json
          git commit -m "fix client dependency security advisories"
          git push origin HEAD:feat/production-overhaul
